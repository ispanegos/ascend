[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ascend-engine"
version = "0.1.0"
description = "ASCEND Stats Engine: raw evidence in, versioned explainable Stats out."
requires-python = ">=3.11"
# Runtime has no third-party dependencies (tomllib, json, hashlib, http.server).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["ascend_engine*"]

[tool.setuptools.package-data]
ascend_engine = ["config/*.toml"]
