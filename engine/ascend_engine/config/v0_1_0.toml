# ---------------------------------------------------------------------------
# Attributes → subdomains → sources (spec §15; weights sum to 1 per attribute)
# A subdomain score is the weighted mean of its available sources. A subdomain
# without evidence is left out (renormalized), never scored as zero.
# ---------------------------------------------------------------------------

[attributes.endurance.subdomains.sustained_locomotion]
weight = 0.35
sources = [{ curve = "E02_walk_speed", weight = 0.4 }, { curve = "E04_run_fraction", weight = 0.6 }]

[attributes.endurance.subdomains.cardiovascular_response]
weight = 0.25
sources = [{ curve = "E04_hr_efficiency", weight = 0.7 }, { curve = "E02_walk_hr_efficiency", weight = 0.3 }]

[attributes.endurance.subdomains.pace_distance]
weight = 0.40
sources = [{ curve = "E04_speed", weight = 1.0 }]

[attributes.strength.subdomains.push]
weight = 0.20
sources = [{ curve = "F01_push_equivalent_reps", weight = 1.0 }]

[attributes.strength.subdomains.pull]
weight = 0.20
sources = [{ curve = "F04_row_index", weight = 1.0 }, { curve = "F04_pull_up_reps", weight = 1.0 }]

[attributes.strength.subdomains.knee_dominant]
weight = 0.20
sources = [{ curve = "F02_goblet_index", weight = 1.0 }]

[attributes.strength.subdomains.hinge]
weight = 0.20
sources = [{ curve = "F03_hinge_index", weight = 1.0 }]

[attributes.strength.subdomains.carry_grip]
weight = 0.20
sources = [{ curve = "F05_carry_strength", weight = 1.0 }]

[attributes.core.subdomains.anti_extension_control]
weight = 0.35
sources = [{ curve = "M06_dead_bug", weight = 1.0 }]

[attributes.core.subdomains.bracing]
weight = 0.35
sources = [{ curve = "F06_plank_s", weight = 1.0 }]

[attributes.core.subdomains.loaded_stability]
