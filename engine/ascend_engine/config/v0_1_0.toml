sources = [{ curve = "M07_error_index", weight = 1.0 }]

# No Spawn test measures Power (spec §13): these stay empty until safe
# power observations exist, so Power stays UNRANKED rather than zero.
[attributes.power.subdomains.explosive_lower_body]
weight = 0.40
sources = []

[attributes.power.subdomains.explosive_hinge]
weight = 0.35
sources = []

[attributes.power.subdomains.explosive_upper_body]
weight = 0.25
sources = []

[attributes.recovery.subdomains.acute_hr_recovery]
