# ASCEND Engine configuration — version 0.1.1
#
# 0.1.1 (Milestone 3.1) corrects scoring semantics of 0.1.0, which was never
# deployed: Spawn alone cannot verify, repeatability is temporal, missing
# evidence cannot raise a Stat, and Peak is split into provisional/verified.
#
# calibration_status = "provisional"
#
# These are INTERNAL CALIBRATION CURVES for a personal v0.1 build. They map
# raw test results onto ASCEND's own 0–100 scale (spec §4). They are not
# population norms, percentiles, rankings or medical thresholds, and must
# never be presented as such. Every value here is expected to change as
# evidence accumulates (spec §73).
#
# Conventions
#   * Curves are monotonic piecewise-linear: points = [[raw, score], ...] with
#     strictly increasing raw values. `direction` says whether a higher raw
#     value means a higher ("increasing") or lower ("decreasing") score.
#     Outside the first/last point the end score is held (no extrapolation).
#   * body_mass_mode: "none" | "absolute" | "relative" | "mixed" (see
#     [normalization]). Only curves that say so use body mass.
#   * No curve uses age, sex or height in v0.1.

engine_version = "0.1.1"
calibration_status = "provisional"
calibration_note = "Internal v0.1 calibration. Not population norms, percentiles, rankings or medical thresholds."

[scale]
min = 0.0
max = 100.0

# ---------------------------------------------------------------------------
# Confidence (spec §6)
# ---------------------------------------------------------------------------

[confidence]
verified_threshold = 0.70
default_repeatability = 0.5
# Coefficient of variation between comparable observations at which
# repeatability reaches 0. Only used once two independent observations exist.
repeatability_cv_tolerance = 0.20
# Initial calibration cap: until an attribute has a qualifying post-Spawn
# verification event, its Confidence cannot exceed this. It must stay below
# verified_threshold so Spawn alone can never verify (Milestone 3.1 §1).
# Confidence is scaled (not clamped) into [0, cap] relative to the best
# Confidence evidence can reach before verification, so less evidence still
# means lower Confidence during the calibration phase.
initial_calibration_cap = 0.69
# Observations of the same test closer than this are one observation for
# longitudinal repeatability and verification (same-day attempts improve
# nothing but the result itself).
independent_observation_min_hours = 24

# ---------------------------------------------------------------------------
# Verification (Milestone 3.1 §1, §6)
# An attribute can leave the initial calibration cap only when evidence from a
# qualifying source arrives at least independent_observation_min_hours after
# its latest baseline (Spawn) evidence.
# ---------------------------------------------------------------------------

[verification]
baseline_sources = ["spawn_test"]
# Event types, not entry sources: how values were entered (manual or wearable)
# is raw_payload.source and only affects quality. Ordinary workouts on
# different days MAY contribute to verification once Milestone 5 defines
# comparable, quality-checked workout evidence (ADR-036); completion alone
# never will. Until then they do not qualify.
qualifying_sources = ["reassessment", "boss", "verified_workout"]

# Some attributes also need a particular kind of evidence before they can
# verify. Recovery needs longitudinal workload or sleep evidence; heart-rate
# recovery from one session is not enough.
[verification.required_any_subdomain]
recovery = ["workload_response", "sleep_recovery"]

# ---------------------------------------------------------------------------
# Missing-domain estimation (Milestone 3.1 §4)
#
# Unknown is not zero, and missing evidence must not raise a Stat. For each
# unmeasured subdomain that a configured test *could* have measured (e.g. a
# skipped test), the estimate is blended toward a conservative prior:
#
#   coverage = observed weight / weight of measurable subdomains
#   blended  = observed_estimate × coverage + prior × (1 − coverage)
#   estimate = min(observed_estimate, blended)
#
# Subdomains with no configured test (Recovery sleep/workload, all of Power)
# do not pull the estimate down; they only lower Confidence.
#
# PROVISIONAL (approved for v0.1 only, ADR-036): to be reviewed against real
# athlete data. The prior (20 = start of the internal "beginner" band) is
# deliberately low but not zero. Guarantee: removing a subdomain the athlete scored at or above
# the prior never raises the estimate; removing their best subdomain always
# lowers it. For a removed subdomain scored below the prior (bottom of the
# modeled range) the rise is bounded by weight × (prior − score).
# ---------------------------------------------------------------------------

[estimation.missing_prior]
endurance = 20.0
strength = 20.0
power = 20.0
core = 20.0
mobility = 20.0
agility = 20.0
recovery = 20.0

[confidence.weights]
coverage = 0.45
recency = 0.25
repeatability = 0.15
quality = 0.15

# Recency factor for confidence: 1.0 within the attribute's grace period,
# then linear down to `floor` over `window_days`.
[recency]
floor = 0.2
window_days = 60

# ---------------------------------------------------------------------------
# Evidence (spec §5)
# ---------------------------------------------------------------------------

# Update weights, not Stat points.
[evidence.weights]
boss = 1.00
spawn_test = 0.90
reassessment = 0.90
verified_workout = 0.55
workout = 0.25
# `wearable` and `manual` are legacy event values from Milestone 2 that mix up
# the entry source (raw_payload.source) with the event type. A wearable
# measurement is not verified workout evidence: it weighs like a workout.
wearable = 0.25
manual = 0.10

# Evidence quality is a product of these factors.
[evidence.quality]
manual_entry = 0.85
wearable_entry = 0.95
# Pain during a completed test: the result is kept (never zero) but trusted less.
pain_reported = 0.70
# The result hit a test cap or the equipment ceiling: it is a lower bound.
censored = 0.85
# Shoulder reach estimated from a category instead of a measured distance.
category_estimate = 0.90

# ---------------------------------------------------------------------------
# Updates from new evidence (spec §16)
# ---------------------------------------------------------------------------

[update]
# confidenceAdjustment = 1 - confidence_damping * current confidence
confidence_damping = 0.5

[update.caps]
workout = 1.0
verified_workout = 2.0
assessment = 5.0
boss = 8.0

# Which cap applies to each evidence source.
[update.cap_for_source]
workout = "workout"
verified_workout = "verified_workout"
manual = "workout"
wearable = "workout"
spawn_test = "assessment"
reassessment = "assessment"
boss = "boss"

# ---------------------------------------------------------------------------
# Decay (spec §17). Never daily punishment; Peak never decays.
# Current regresses only after `grace_days` without relevant evidence, by at
# most `points_per_week`, and never below `retained_fraction` of the Current
# at the last evidence.
# ---------------------------------------------------------------------------

[decay.endurance]
grace_days = 14
points_per_week = 0.5
retained_fraction = 0.85

[decay.recovery]
grace_days = 10
points_per_week = 0.5
retained_fraction = 0.85

[decay.strength]
grace_days = 21
points_per_week = 0.3
retained_fraction = 0.90

[decay.power]
grace_days = 21
points_per_week = 0.3
retained_fraction = 0.90

[decay.core]
grace_days = 21
points_per_week = 0.3
retained_fraction = 0.90

[decay.agility]
grace_days = 21
points_per_week = 0.3
retained_fraction = 0.90

# Mobility changes on direct evidence, not on time (spec §17).
[decay.mobility]
grace_days = 30
points_per_week = 0.0
retained_fraction = 1.0

# ---------------------------------------------------------------------------
# Overall (spec §8)
# ---------------------------------------------------------------------------

[overall]
weighted_mean_share = 0.80
lowest_three_share = 0.20
required_attributes = ["endurance", "strength", "core", "mobility", "agility"]

[overall.weights]
endurance = 0.18
strength = 0.18
power = 0.12
core = 0.14
mobility = 0.12
agility = 0.12
recovery = 0.14

# ---------------------------------------------------------------------------
# Body-size normalization (spec §15; Milestone 3 brief §3) — PROVISIONAL
#
# Why it exists: moving an external load is easier for a larger body, and
# carrying or moving one's own body is harder. Without some adjustment a
# heavier athlete would look stronger and a lighter one weaker for the same
# relative capability.
#
#   absolute: raw value (no adjustment)
#   relative: raw / body_mass_kg            — used for the farmer carry, where
#             load relative to the athlete's own mass is what limits posture
#   mixed:    raw / body_mass_kg ** 0.67    — used for loaded strength sets.
#             Allometric scaling sits between absolute and relative so neither
#             heavier nor lighter athletes are systematically favoured.
#
# These are provisional ASCEND choices, not validated standards. The raw,
# unadjusted load always stays in the evidence and the calculation trace.
# ---------------------------------------------------------------------------

[normalization]
mixed_exponent = 0.67

# ---------------------------------------------------------------------------
# Feature extraction parameters
# ---------------------------------------------------------------------------

[features.M01]
# Points per attempt; best attempt is scored. Range 0–4.
depth_points = { above_parallel = 0.0, parallel = 1.0, below_parallel = 2.0 }
heels_points = { grounded = 1.0, lift = 0.0 }
control_points = { stable = 1.0, compensation = 0.5, balance_loss = 0.0 }

[features.M03]
# Equivalent reach (cm, positive = overlap) when only a category was recorded.
category_reach_cm = { overlap = 3.0, touch = 0.0, within_hand = -10.0, beyond_hand = -22.0 }

[features.M04]
cap_s = 60.0

[features.M07]
# Error index = mean errors per attempt + weight × share of attempts with a balance loss.
balance_loss_weight = 2.0

[features.strength_sets]
# "Ten-rep-equivalent load" = load × min(reps, target) / target × technique factor.
target_reps = 10
technique_factor = { clean = 1.0, minor_compensation = 0.9, major_compensation = 0.75, stopped_for_technique = 0.7 }
# A set counts as censored (a lower bound) when the athlete stopped adding load
# only because nothing heavier was available and effort was at most this RPE.
censored_max_rpe = 7

[features.F01]
# Incline push-ups count as fewer standard-equivalent reps: factor by hand height.
incline_equivalence = [[0.0, 1.0], [30.0, 0.75], [45.0, 0.65], [60.0, 0.55], [90.0, 0.40], [150.0, 0.25]]

[features.F05]
cap_s = 60.0

[features.F06]
cap_s = 120.0

# ---------------------------------------------------------------------------
# Scoring curves (provisional)
# ---------------------------------------------------------------------------

[curves.M01_squat_points]
rationale = "Best of three attempts scored as depth (0–2) + heels grounded (1) + control (0–1). A clean, deep, heels-down squat is the top of what this screen can show."
weakness = "Ordinal points treated as linear; the test ceiling (4 points → 65) cannot separate mobile athletes; depth is self-judged."
test = "M01"
feature = "squat_points_best"
direction = "increasing"
body_mass_mode = "none"
points = [[0.0, 10.0], [1.0, 22.0], [2.0, 35.0], [3.0, 50.0], [4.0, 65.0]]

[curves.M02_ankle_mean_cm]
rationale = "Mean toe-to-wall distance of both sides. Around 10 cm is commonly treated as adequate ankle range in knee-to-wall screening, so it sits mid-scale."
weakness = "Mean hides asymmetry (kept as a trace feature, not scored); foot length is not accounted for."
test = "M02"
feature = "ankle_mean_cm"
direction = "increasing"
body_mass_mode = "none"
points = [[0.0, 10.0], [4.0, 25.0], [8.0, 40.0], [10.0, 50.0], [12.0, 60.0], [15.0, 75.0]]

[curves.M03_shoulder_reach_cm]
rationale = "Mean reach across both sides (overlap positive). Fingertips touching sits mid-scale; categories are converted to an equivalent reach when no distance was measured."
weakness = "Category conversion is coarse (quality is reduced when used); arm length and self-measurement are not accounted for."
test = "M03"
feature = "shoulder_reach_mean_cm"
direction = "increasing"
body_mass_mode = "none"
points = [[-30.0, 10.0], [-20.0, 20.0], [-10.0, 35.0], [0.0, 50.0], [5.0, 62.0], [10.0, 72.0]]

[curves.M04_balance_s]
rationale = "Mean of each leg's best single-leg stance time. 60 s cap maps to 65 so the test cannot claim elite balance."
weakness = "Eyes-open stance saturates quickly for trained athletes; the cap makes high results a lower bound (flagged censored)."
test = "M04"
feature = "balance_best_mean_s"
direction = "increasing"
body_mass_mode = "none"
points = [[0.0, 5.0], [5.0, 15.0], [15.0, 30.0], [30.0, 45.0], [45.0, 55.0], [60.0, 65.0]]

[curves.M05_sit_reach_cm]
rationale = "Fingertip reach relative to toes. Reaching the toes sits just below mid-scale; positive reach rises slowly."
weakness = "Influenced by limb proportions; one reach, no repeat; box setup varies at home."
test = "M05"
feature = "sit_reach_cm"
direction = "increasing"
body_mass_mode = "none"
points = [[-30.0, 10.0], [-15.0, 25.0], [-5.0, 40.0], [0.0, 48.0], [5.0, 58.0], [10.0, 68.0], [20.0, 80.0]]

[curves.M06_dead_bug]
rationale = "Self-rated quality of 10 reps per side: clean / completed with compensation / unable."
weakness = "Three categories only and self-judged; cannot separate good from excellent trunk control."
test = "M06"
feature = "dead_bug_quality"
kind = "categorical"
map = { clean = 55.0, completed_with_compensation = 38.0, unable = 15.0 }

[curves.M07_time_s]
rationale = "Best time of the 16 m forward–lateral–backward–lateral rectangle. About 8 s sits in the upper-middle; walking pace (16–20 s) sits at the bottom."
weakness = "Home timing is imprecise (manual stopwatch); surface and turning technique affect times; no published reference for this exact layout."
test = "M07"
feature = "agility_best_time_s"
direction = "decreasing"
body_mass_mode = "none"
points = [[6.0, 80.0], [7.0, 70.0], [8.0, 60.0], [9.5, 48.0], [11.0, 38.0], [13.0, 28.0], [16.0, 18.0], [20.0, 10.0]]

[curves.M07_error_index]
rationale = "Mean errors per attempt plus 2 × the share of attempts with a balance loss. Zero errors and no loss of balance maps to 70."
weakness = "Error counting is self-reported; error weights are an assumption."
test = "M07"
feature = "agility_error_index"
direction = "decreasing"
body_mass_mode = "none"
points = [[0.0, 70.0], [0.5, 60.0], [1.0, 50.0], [2.0, 38.0], [4.0, 22.0], [8.0, 10.0]]

[curves.F01_push_equivalent_reps]
rationale = "Clean push-up reps; incline reps are converted to standard-equivalent reps by hand height before scoring. Around 30 clean standard reps sits mid-scale."
weakness = "The incline conversion factors are estimates; bodyweight movement so no body-mass normalization, which favours lighter athletes slightly."
test = "F01"
feature = "push_equivalent_reps"
direction = "increasing"
body_mass_mode = "none"
points = [[0.0, 10.0], [5.0, 22.0], [10.0, 32.0], [20.0, 45.0], [30.0, 55.0], [40.0, 63.0], [50.0, 70.0]]

[curves.F02_goblet_index]
rationale = "Best set's ten-rep-equivalent load (load × reps/10 × technique factor), divided by body mass^0.67."
weakness = "Linear rep conversion is crude below 10 reps; kettlebell inventory often caps the result (flagged censored); allometric exponent is provisional."
test = "F02"
feature = "goblet_ten_rep_kg"
direction = "increasing"
body_mass_mode = "mixed"
points = [[0.0, 5.0], [0.3, 15.0], [0.6, 28.0], [1.0, 40.0], [1.4, 50.0], [1.8, 58.0], [2.4, 68.0]]

[curves.F03_hinge_index]
rationale = "Kettlebell deadlift ten-rep-equivalent load divided by body mass^0.67. Hinge loads are higher than squat loads, so the curve is stretched."
weakness = "Home equipment frequently caps the result; one or two implements change the lift; exponent provisional."
test = "F03"
feature = "hinge_ten_rep_kg"
direction = "increasing"
body_mass_mode = "mixed"
points = [[0.0, 5.0], [0.6, 15.0], [1.2, 28.0], [2.0, 40.0], [2.8, 50.0], [3.6, 58.0], [4.8, 68.0]]

[curves.F04_row_index]
rationale = "Bent-over row ten-rep-equivalent load per arm (one-arm: implement load; two-arm: total ÷ 2) divided by body mass^0.67."
weakness = "One-arm and two-arm rows are treated as equivalent per arm; torso angle is not controlled."
test = "F04"
feature = "row_ten_rep_kg_per_arm"
direction = "increasing"
body_mass_mode = "mixed"
points = [[0.0, 5.0], [0.3, 15.0], [0.6, 28.0], [1.0, 40.0], [1.4, 50.0], [1.8, 58.0], [2.4, 68.0]]

[curves.F04_pull_up_reps]
rationale = "Strict pull-up reps when a bar is available. One rep is already meaningful pulling strength."
weakness = "Bodyweight movement strongly penalises heavier athletes; only used when the athlete chooses pull-ups."
test = "F04"
feature = "pull_up_reps"
direction = "increasing"
body_mass_mode = "none"
points = [[0.0, 15.0], [1.0, 30.0], [3.0, 40.0], [6.0, 50.0], [10.0, 60.0], [15.0, 70.0]]

[curves.F05_carry_core]
rationale = "Farmer carry total load × minutes ÷ body mass, for loaded trunk stability. Carrying body mass for a minute sits in the upper-middle."
weakness = "Combines load and duration linearly; the 60 s cap makes strong results a lower bound; posture judged by the athlete."
test = "F05"
feature = "carry_load_minutes_kg"
direction = "increasing"
body_mass_mode = "relative"
# Raw feature: total load (kg) × duration (min). Relative: ÷ body mass.
points = [[0.0, 5.0], [0.1, 15.0], [0.25, 28.0], [0.5, 42.0], [0.75, 52.0], [1.0, 62.0], [1.5, 75.0]]

[curves.F05_carry_strength]
rationale = "Same carry index for grip/carry strength, with a slightly lower curve because grip is the usual limit."
weakness = "Shares one test with Core (the same evidence informs two attributes); distance is not used."
test = "F05"
feature = "carry_load_minutes_kg"
direction = "increasing"
body_mass_mode = "relative"
points = [[0.0, 5.0], [0.2, 18.0], [0.4, 30.0], [0.6, 40.0], [0.8, 50.0], [1.0, 58.0], [1.5, 70.0]]

[curves.F06_plank_s]
rationale = "Technical plank hold. 60 s sits just below mid-scale; the 120 s cap maps to 62 so holding longer cannot claim high capability."
weakness = "Endurance-style hold; position loss is self-judged; the cap makes long holds a lower bound."
test = "F06"
feature = "plank_s"
direction = "increasing"
body_mass_mode = "none"
points = [[0.0, 5.0], [15.0, 15.0], [30.0, 25.0], [60.0, 40.0], [90.0, 52.0], [120.0, 62.0]]

[curves.E02_walk_speed]
rationale = "6-minute brisk-walk speed. 100 m/min (6 km/h) sits in the lower middle; 135 m/min (8.1 km/h) is near the top of walking."
weakness = "Route, surface and GPS accuracy vary; the curve stops at 60 because walking speed saturates."
test = "E02"
feature = "walk_speed_m_per_min"
direction = "increasing"
body_mass_mode = "none"
points = [[60.0, 10.0], [75.0, 20.0], [90.0, 30.0], [105.0, 40.0], [120.0, 50.0], [135.0, 60.0]]

[curves.E02_walk_hr_efficiency]
rationale = "Walking speed per beat above resting heart rate: faster walking at a lower heart-rate rise scores higher."
weakness = "Needs two optional HR readings; wrist HR accuracy varies; heat and caffeine affect HR."
test = "E02"
feature = "walk_hr_efficiency"
direction = "increasing"
body_mass_mode = "none"
# Walking speed (m/min) per bpm above resting heart rate.
points = [[0.5, 10.0], [1.0, 20.0], [1.5, 30.0], [2.0, 40.0], [2.5, 50.0], [3.0, 60.0], [4.0, 72.0]]

[curves.E04_speed]
rationale = "20-minute run/walk average speed. 150 m/min (9 km/h) sits around 40; 250 m/min (15 km/h) sits in the 60s."
weakness = "Pacing strategy, route and GPS affect distance; one effort; not adjusted for terrain."
test = "E04"
feature = "run_walk_speed_m_per_min"
direction = "increasing"
body_mass_mode = "none"
points = [[60.0, 8.0], [80.0, 15.0], [100.0, 22.0], [120.0, 30.0], [150.0, 40.0], [180.0, 48.0], [210.0, 55.0], [250.0, 63.0], [300.0, 72.0]]

[curves.E04_run_fraction]
rationale = "Share of the 20 minutes spent running. Running throughout scores 55 on its own; speed is scored separately."
weakness = "Self-estimated split; a slow continuous jog and a fast run score the same here."
test = "E04"
feature = "run_fraction"
direction = "increasing"
body_mass_mode = "none"
points = [[0.0, 15.0], [0.25, 25.0], [0.5, 35.0], [0.75, 45.0], [1.0, 55.0]]

[curves.E04_hr_efficiency]
rationale = "Run/walk speed per beat above resting heart rate, a proxy for aerobic efficiency."
weakness = "Depends on optional HR and resting HR; average HR over 20 minutes includes drift."
test = "E04"
feature = "run_walk_hr_efficiency"
direction = "increasing"
body_mass_mode = "none"
points = [[0.6, 10.0], [0.9, 20.0], [1.2, 30.0], [1.5, 40.0], [1.8, 50.0], [2.1, 60.0], [2.6, 72.0]]

[curves.E03_hr_drop_1min]
rationale = "Heart-rate drop in the first minute after the brisk walk. A larger drop scores higher."
weakness = "Walking effort before the test varies; standing vs walking during recovery changes the drop; not a medical measure."
test = "E03"
feature = "hr_drop_1min_bpm"
direction = "increasing"
body_mass_mode = "none"
points = [[0.0, 5.0], [6.0, 15.0], [12.0, 28.0], [18.0, 40.0], [24.0, 50.0], [30.0, 60.0], [40.0, 72.0], [50.0, 80.0]]

# ---------------------------------------------------------------------------
# Attributes → subdomains → sources (spec §15; weights sum to 1 per attribute)
# A subdomain score is the weighted mean of its available sources, with the
# same conservative missing-evidence estimate as attributes when one of
# several complementary sources is missing (`alternatives = true` exempts
# sources the athlete chooses between). Never scored as zero.
# ---------------------------------------------------------------------------

[attributes.endurance.subdomains.sustained_locomotion]
weight = 0.35
sources = [{ curve = "E02_walk_speed", weight = 0.4 }, { curve = "E04_run_fraction", weight = 0.6 }]

[attributes.endurance.subdomains.cardiovascular_response]
weight = 0.25
sources = [{ curve = "E04_hr_efficiency", weight = 0.7 }, { curve = "E02_walk_hr_efficiency", weight = 0.3 }]

[attributes.endurance.subdomains.pace_distance]
weight = 0.40
sources = [{ curve = "E04_speed", weight = 1.0 }]

[attributes.strength.subdomains.push]
weight = 0.20
sources = [{ curve = "F01_push_equivalent_reps", weight = 1.0 }]

[attributes.strength.subdomains.pull]
weight = 0.20
# Row or pull-up: the athlete does one, so the other is not missing evidence.
alternatives = true
sources = [{ curve = "F04_row_index", weight = 1.0 }, { curve = "F04_pull_up_reps", weight = 1.0 }]

[attributes.strength.subdomains.knee_dominant]
weight = 0.20
sources = [{ curve = "F02_goblet_index", weight = 1.0 }]

[attributes.strength.subdomains.hinge]
weight = 0.20
sources = [{ curve = "F03_hinge_index", weight = 1.0 }]

[attributes.strength.subdomains.carry_grip]
weight = 0.20
sources = [{ curve = "F05_carry_strength", weight = 1.0 }]

[attributes.core.subdomains.anti_extension_control]
weight = 0.35
sources = [{ curve = "M06_dead_bug", weight = 1.0 }]

[attributes.core.subdomains.bracing]
weight = 0.35
sources = [{ curve = "F06_plank_s", weight = 1.0 }]

[attributes.core.subdomains.loaded_stability]
weight = 0.30
sources = [{ curve = "F05_carry_core", weight = 1.0 }]

[attributes.mobility.subdomains.ankle]
weight = 0.25
sources = [{ curve = "M02_ankle_mean_cm", weight = 1.0 }]

[attributes.mobility.subdomains.squat_pattern]
weight = 0.25
sources = [{ curve = "M01_squat_points", weight = 1.0 }]

[attributes.mobility.subdomains.shoulder]
weight = 0.25
sources = [{ curve = "M03_shoulder_reach_cm", weight = 1.0 }]

[attributes.mobility.subdomains.posterior_chain]
weight = 0.25
sources = [{ curve = "M05_sit_reach_cm", weight = 1.0 }]

[attributes.agility.subdomains.balance_control]
weight = 0.35
sources = [{ curve = "M04_balance_s", weight = 1.0 }]

[attributes.agility.subdomains.change_of_direction]
weight = 0.40
sources = [{ curve = "M07_time_s", weight = 1.0 }]

[attributes.agility.subdomains.movement_accuracy]
weight = 0.25
sources = [{ curve = "M07_error_index", weight = 1.0 }]

# No Spawn test measures Power (spec §13): these stay empty until safe
# power observations exist, so Power stays UNRANKED rather than zero.
[attributes.power.subdomains.explosive_lower_body]
weight = 0.40
sources = []

[attributes.power.subdomains.explosive_hinge]
